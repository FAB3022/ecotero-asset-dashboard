<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Ecotero Asset Securement</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6b6b'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one quiet top bar, a single centred column, summary before detail. Colour is reserved for status. */
:root{
  --page:#f5f7f7; --surface:#ffffff; --surface-2:#f1f4f4;
  --ink:#0f1717; --ink-2:#465353; --muted:#6b7878; --line:#e2e7e7; --line-2:#cbd3d3;
  --accent:#0b6b6b; --accent-ink:#ffffff; --accent-soft:#e1f0ef;
  --good:#0ca30c; --warn:#fab219; --info:#2a78d6; --crit:#d03b3b; --crit-ink:#b42a2a; --hold:#4a3aa7; --none:#8a9596; --na:#cdd4d4;
  --scrim:rgba(8,14,14,.42); --shadow:0 16px 48px rgba(15,23,23,.16);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0c1011; --surface:#141a1b; --surface-2:#1a2122;
    --ink:#eef3f3; --ink-2:#b9c4c4; --muted:#8b9797; --line:#232c2d; --line-2:#313c3d;
    --accent:#5cc8c2; --accent-ink:#062221; --accent-soft:#16302f;
    --good:#0ca30c; --warn:#fab219; --info:#3987e5; --crit:#d03b3b; --crit-ink:#f08a8a; --hold:#9085e9; --none:#6f7b7c; --na:#3a4546;
    --scrim:rgba(0,0,0,.6); --shadow:0 16px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0c1011; --surface:#141a1b; --surface-2:#1a2122;
  --ink:#eef3f3; --ink-2:#b9c4c4; --muted:#8b9797; --line:#232c2d; --line-2:#313c3d;
  --accent:#5cc8c2; --accent-ink:#062221; --accent-soft:#16302f;
  --good:#0ca30c; --warn:#fab219; --info:#3987e5; --crit:#d03b3b; --crit-ink:#f08a8a; --hold:#9085e9; --none:#6f7b7c; --na:#3a4546;
  --scrim:rgba(0,0,0,.6); --shadow:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);display:flex;align-items:center;gap:0 28px;min-height:56px}
.mark{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.mark b{font:600 20px/1 var(--font-display);letter-spacing:-.01em}
.mark span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:18px 12px 16px;color:var(--ink-2);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav button:focus-visible{outline-offset:-3px}
.side{display:flex;align-items:center;gap:6px 14px;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--none);flex:none}
.sync[data-s="live"] i{background:var(--good)}
.sync[data-s="busy"] i{background:var(--info)}
.sync[data-s="off"] i{background:var(--crit)}
.lnk{font-size:13px;font-weight:500;text-decoration:none}
.lnk:hover{text-decoration:underline}

.page{max-width:1200px;margin:0 auto;padding-block:32px 80px;padding-inline:clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:24px;min-width:0}
.vh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.vh h1{margin:0;font:600 24px/1.2 var(--font-body);letter-spacing:-.015em;text-wrap:balance}
.vh p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.row.between{justify-content:space-between}
.banner{padding:10px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--crit-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=search],input[type=date],input[type=password],input[type=url],select,textarea{padding:7px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
textarea{resize:vertical;min-height:72px;width:100%;line-height:1.45}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-2);opacity:1}

.lead{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,1.7fr);gap:24px 40px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line)}
.fig{font:600 60px/1 var(--font-body);letter-spacing:-.03em}
.fig small{font-size:22px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:8px}
.lead .lbl{margin:8px 0 14px;color:var(--ink-2)}
.meter{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 0}
.stat{padding-left:20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:600 26px/1.2 var(--font-body);letter-spacing:-.01em}
.stat .k{font-size:13px;color:var(--ink)}
.stat .s{font-size:12px;color:var(--muted)}

.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px}
.card h2{margin:0;font:600 15px/1.3 var(--font-body)}
.card .sub{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:60ch}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg button:focus-visible{outline-offset:-2px}
.seg .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:5px}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.g{flex:none;display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--none)}
.g-good{background:var(--good)}
.g-warn{background:transparent;box-shadow:inset 0 0 0 3px var(--warn)}
.g-info{background:linear-gradient(90deg,var(--info) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--info)}
.g-crit{border-radius:2px;background:var(--crit);transform:rotate(45deg) scale(.8)}
.g-hold{border-radius:2px;background:var(--hold)}
.g-none{background:transparent;box-shadow:inset 0 0 0 1.5px var(--none)}
.g-na{border-radius:1px;height:2px;background:var(--none)}
.s-good{background:var(--good)} .s-warn{background:var(--warn)} .s-info{background:var(--info)} .s-crit{background:var(--crit)}
.s-hold{background:var(--hold)} .s-none{background:var(--none)} .s-na{background:var(--na)}

.bars{display:grid;grid-template-columns:minmax(84px,max-content) minmax(0,1fr) max-content;gap:10px 14px;align-items:center}
.bars .name{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:500}
.bars .name:hover{text-decoration:underline}
.track{display:flex;height:14px;min-width:0}
.stack{display:flex;gap:2px;height:100%;min-width:4px;border-radius:0 4px 4px 0;overflow:hidden}
.stack span{min-width:3px;height:100%}
.stack span:focus-visible{outline-offset:-2px;outline-color:var(--ink)}
.num{font:400 12px var(--font-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .num{text-align:right}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 32px}
.check{display:flex;flex-direction:column;gap:6px;min-width:0}
.check div:first-child{display:flex;justify-content:space-between;gap:12px;font-size:13px}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .g{align-self:center}
.li .t{font-weight:500;overflow-wrap:anywhere;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.li button.t{cursor:pointer}
.li button.t:hover{text-decoration:underline}
.li .m{grid-column:2;font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.tag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--accent-soft);font-size:12px;font-weight:500}
.chip button{border:0;background:none;cursor:pointer;padding:0 6px;font-size:14px;line-height:1;color:var(--ink-2)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th .arr{font:400 11px var(--font-mono);color:var(--accent);min-width:8px}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl td.id{font:500 12px/1.7 var(--font-mono);white-space:nowrap}
.tbl td.id button{all:unset;cursor:pointer;color:var(--accent)}
.tbl td.id button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl td.wrap{min-width:220px;max-width:520px;overflow-wrap:anywhere}
.tbl td.pre{white-space:pre-line}
.tbl td.nw{white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .sub2{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ticks{display:inline-flex;gap:2px;vertical-align:middle;margin-left:8px}
.ticks i{width:4px;height:10px;border-radius:1px;background:var(--line-2)}
.ticks i.on{background:var(--accent)}
.count{font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12px;color:var(--ink-2)}
.filters input[type=search]{flex:1 1 200px}
.filters select{flex:0 1 168px;max-width:168px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:12px;background:var(--surface)}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:4px}

.kv{display:grid;grid-template-columns:minmax(0,1fr) max-content max-content;gap:9px 18px;align-items:baseline;font-size:13px}
.kv .d{font:400 12px var(--font-mono);color:var(--muted);text-align:right;white-space:nowrap}
.kv .d.up,.kv .d.down{color:var(--ink)}
.upd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.upd h3{margin:0;font:600 15px/1.3 var(--font-body)}
.upd .body{white-space:pre-line;overflow-wrap:anywhere;color:var(--ink);max-width:78ch}
.upd .body b{display:block;margin:18px 0 4px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.upd .body b:first-child{margin-top:0}
svg.trend{display:block;width:100%;height:auto}
svg.trend text{font:11px var(--font-mono);fill:var(--muted)}
svg.trend .grid{stroke:var(--line);stroke-width:1}
svg.trend .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.trend .ar{fill:var(--accent);opacity:.1}
svg.trend .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.trend .hit{fill:transparent}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.drawer>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.drawer>header h2{margin:2px 0 0;font:600 18px/1.25 var(--font-body);letter-spacing:-.01em;overflow-wrap:anywhere}
.drawer .body{flex:1;overflow-y:auto;padding:18px 24px 28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;align-content:start}
.drawer .body .w{grid-column:1/-1}
.drawer .body h3{grid-column:1/-1;margin:10px 0 0;padding-top:16px;border-top:1px solid var(--line);font:600 11px/1.4 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drawer .body h3.first{border-top:0;padding-top:0;margin-top:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:500;color:var(--ink-2)}
.fld .hint,.hint{font-size:12px;color:var(--muted)}
.fld input,.fld select{width:100%}
.drawer>footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 24px;border-top:1px solid var(--line)}
.sp{flex:1}
.err{grid-column:1/-1;padding:10px 12px;border:1px solid var(--crit);border-radius:7px;background:var(--surface-2);color:var(--ink);font-size:13px}
.err ul{margin:0;padding-left:18px}
.gatebox{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.gatebox .gh{display:flex;justify-content:space-between;gap:12px;font-weight:500}
.gatebox ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:13px}
.gatebox li{display:flex;gap:8px;align-items:baseline;color:var(--ink-2)}
.gatebox li.ok{color:var(--ink)}
.gatebox li .mk{font:500 11px var(--font-mono);width:36px;flex:none;color:var(--muted)}
.gatebox li.ok .mk{color:var(--ink)}
.setting{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.setting p{margin:0;color:var(--ink-2);font-size:13px}
.setting code{font:12px var(--font-mono);overflow-wrap:anywhere;color:var(--ink)}
.onoff{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.onoff:first-of-type{border-top:0}

.connect{max-width:520px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px;display:flex;flex-direction:column;gap:16px}
.connect h1{margin:0;font:600 22px/1.2 var(--font-body);letter-spacing:-.015em}
.connect p{margin:0;color:var(--ink-2)}
.connect form{display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-weight:500;z-index:60;max-width:min(520px,calc(100% - 32px))}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;max-width:260px}

@media (max-width:860px){
  .bar-in{flex-wrap:wrap;gap:0 16px;padding-top:10px}
  .side{margin-left:auto}
  .nav{order:3;flex-basis:100%;margin-inline:-12px}
  .nav button{padding:12px 12px 10px}
  .side{gap:6px 10px}
  .lead,.cols{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .checks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding-block:24px 64px}
}
@media (max-width:560px){
  .drawer .body,.gatebox ul,.checks{grid-template-columns:minmax(0,1fr)}
  .fig{font-size:48px}
  .mark span,.sync span{display:none}
  .card,.upd{padding:18px}
  .connect{padding:22px}
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="mark"><b>Ecotero</b><span>Asset securement</span></div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div class="side">
    <span class="sync" id="sync"><i></i><span>Not connected</span></span>
    <a class="lnk" id="sheet-link" target="_blank" rel="noopener" hidden>Open sheet</a>
    <button class="btn quiet sm" id="btn-settings" type="button" hidden>Settings</button>
  </div>
</div></header>
<main class="page">
  <div class="banner" id="banner" role="status" hidden></div>
  <section class="view" id="v-connect" hidden></section>
  <section class="view" id="v-overview" hidden></section>
  <section class="view" id="v-assets" hidden></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-weekly" hidden></section>
  <section class="view" id="v-records" hidden></section>
</main>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;

function trendCard(){
  const snaps = state.snapshots.slice(-12), c = card('Verified over time', 'Assets secured and verified at each weekly snapshot.');
  if (snaps.length < 2){ c.append(h('p', {class: 'sub'}, snaps.length ? 'One snapshot so far. The line appears after the second weekly snapshot.' : 'The line appears after two weekly snapshots.')); return c; }
  const NS = 'http://www.w3.org/2000/svg', W = 400, HT = 180, L = 30, Rt = 14, T = 18, B = 28;
  const vals = snaps.map(s => (s.metrics && s.metrics.verified) || 0), top = Math.max(4, Math.ceil(Math.max(...vals) * 1.2 / 4) * 4);
  const x = i => L + (W - L - Rt) * (snaps.length === 1 ? 0.5 : i / (snaps.length - 1)), y = v => T + (HT - T - B) * (1 - v / top);
  const el = (tag, at, text) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (text != null) n.textContent = text; return n; };
  const svg = el('svg', {class: 'trend', viewBox: '0 0 ' + W + ' ' + HT, role: 'img', 'aria-label': 'Verified assets by week: ' + snaps.map((s, i) => fmtD(s.date) + ' ' + vals[i]).join(', ')});
  [0, top / 2, top].forEach(v => { svg.append(el('line', {class: 'grid', x1: L, x2: W - Rt, y1: y(v), y2: y(v)}), el('text', {x: L - 8, y: y(v) + 4, 'text-anchor': 'end'}, String(v))); });
  const pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  svg.append(el('polygon', {class: 'ar', points: L + ',' + y(0) + ' ' + pts + ' ' + x(vals.length - 1) + ',' + y(0)}), el('polyline', {class: 'ln', points: pts}));
  const every = Math.ceil(snaps.length / 4);
  snaps.forEach((s, i) => {
    if (i % every === 0 || i === snaps.length - 1) svg.append(el('text', {x: x(i), y: HT - 8, 'text-anchor': i === 0 ? 'start' : i === snaps.length - 1 ? 'end' : 'middle'}, fmtD(s.date).replace(/ \d{4}$/, '')));
    svg.append(el('circle', {class: 'pt', cx: x(i), cy: y(vals[i]), r: i === snaps.length - 1 ? 5 : 4}));
    svg.append(el('circle', {class: 'hit', cx: x(i), cy: y(vals[i]), r: 14, tabindex: 0, 'data-tip': fmtD(s.date) + ': ' + vals[i] + ' verified'}));
  });
  svg.append(el('text', {x: x(vals.length - 1) - 10, y: y(vals[vals.length - 1]) - 10, 'text-anchor': 'end'}, String(vals[vals.length - 1])));
  c.append(svg);
  return c;
}

function control(id, type, val, options, sug){

async function commit(run, okMsg){
  const btn = $('#btn-save'), label = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Saving'; }
  try { await run(); closeDrawer(); toast(okMsg); sync(true); }
  catch (e){
    let msg = e.message || 'That change could not be saved.';
    if (e.code === 'conflict') msg = 'Someone changed ' + (e.fields || []).join(', ') + ' in the sheet while you were editing. Close this panel and open the asset again to see the latest values.';
    else if ((e.code === 'rejected' || e.code === 'invalid_value') && e.fields) msg += ' Check: ' + e.fields.join(', ') + '.';

function openAsset(id){

  };
  if (isNew) form.append(h('div', {class: 'fld w'}, h('label', {for: 'f-id'}, H.id), h('input', {id: 'f-id', type: 'text', autocomplete: 'off', placeholder: 'Leave blank to use the next ID'})));
  let firstGroup = !isNew;
  FORM_GROUPS.forEach(grp => {

    const present = grp[1].filter(hasCol);

  const other = hs.filter(x => x !== H.id && !known[x]);
  if (other.length){ form.append(h('h3', null, 'Other columns')); other.forEach(x => form.append(field(x))); }
  const read = () => { const v = {}; hs.forEach(hd => { if (hd === H.id) return; const el = document.getElementById(fid(hd)); if (el) v[hd] = el.value.trim(); }); return v; };
  const paintGate = () => {
    const g = gate(read());
    $('#gatebox').replaceChildren(
      h('div', {class: 'gh'}, h('span', null, 'Evidence gate'), h('span', {class: 'num'}, g.pass + ' of ' + g.total + ' checks pass')), meter(g.pass / g.total),
      h('ul', null, g.items.map(x => h('li', {class: x.pass ? 'ok' : ''}, h('span', {class: 'mk'}, x.na ? 'N/A' : (x.pass ? 'PASS' : 'OPEN')), x.label))),
      h('div', {class: 'hint'}, VERIFIED + ' can only be saved from here once every check passes.'));
  };
  form.addEventListener('input', paintGate); form.addEventListener('change', paintGate);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = read(), errs = [];
    [H.brand, H.platform].forEach(hd => { if (hasCol(hd) && !v[hd]) errs.push(hd + ' is required.'); });
    Object.keys(v).forEach(hd => {
      if (SECRET.test(v[hd])) errs.push(hd + ' looks like it contains a credential. Keep it in the vault and record only the vault reference.');
      if (v[hd].charAt(0) === '=') errs.push(hd + ' cannot start with an equals sign.');
    });
    if (v[H.status] === VERIFIED){

document.addEventListener('visibilitychange', () => { if (!document.hidden && !drawer) sync(); });
window.addEventListener('hashchange', () => { const v = (location.hash || '').slice(1); if (connected() && VIEWS[v] && v !== state.view) go(v); });
const oops = msg => { document.documentElement.setAttribute('data-error', msg); const b = $('#banner'); if (b){ b.hidden = false; b.textContent = 'Something went wrong on this page. Reload it, and if it happens again tell the project lead: ' + msg; } };
window.addEventListener('error', e => oops(e.message || 'unknown error'));
window.addEventListener('unhandledrejection', e => oops(String((e.reason && e.reason.message) || e.reason || 'unknown error')));
setInterval(() => { if (!document.hidden && !state.busy) sync(); }, 45000);

buildShell();
if (connected()){ go(VIEWS[startView] ? startView : 'overview'); sync(true); }
else showConnect('');
})();
</script>
</body>
</html>
